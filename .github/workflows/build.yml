name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Mod with Loom
        run: |
          if [ -f "build.gradle" ]; then
            gradle build --no-daemon
          elif [ -f "henclient-reborn/build.gradle" ]; then
            cd henclient-reborn
            gradle build --no-daemon
          else
            DIR=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1 | xargs dirname)
            cd "$DIR"
            gradle build --no-daemon
          fi

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenClient-Reborn-1.21.11
          path: "**/build/libs/*-1.0.0.jar"
          if-no-files-found: error
